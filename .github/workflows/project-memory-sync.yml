name: Project memory snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '53 10 * * *'
  push:
  pull_request:
    types: [opened, reopened, synchronize, closed, ready_for_review]
  issues:
    types: [opened, reopened, closed, edited]
  workflow_run:
    workflows: ["CI", "Tests"]
    types: [completed]
permissions:
  contents: write
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: project-memory-default
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name != 'pull_request' && (github.event_name != 'push' || github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test renderer
        run: python -m unittest discover -s tests -p 'test_project_memory.py' -v
      - name: Refresh GitHub metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/refresh_project_memory.py
      - name: Commit generated snapshot only
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs/ESTADO_GITHUB_AUTO.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh project GitHub snapshot'
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          for attempt in 1 2 3; do
            git fetch origin "$DEFAULT_BRANCH"
            if ! git rebase "origin/$DEFAULT_BRANCH"; then git rebase --abort; exit 1; fi
            if git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          exit 1
